name: 빈자리 감시

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 부하에 따라 지연될 수 있음)
  workflow_dispatch:        # 수동 실행 버튼

concurrency:
  group: slot-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 빈자리 확인
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          ALERT_LABEL: ${{ vars.ALERT_LABEL }}
        run: python ci_check.py

      - name: 상태 저장
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "slot-watch"
          git config user.email "slot-watch@users.noreply.github.com"
          git add state.json
          git commit -m "상태 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
